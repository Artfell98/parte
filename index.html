const KEY = 'parte-key-' + P.salt;
async function show(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}

  const a = await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:'public-key', id:credId}],
    userVerification:'required', timeout:60000, extensions:{prf:{eval:{first:PRF_IN}}}}});
  const r = a.getClientExtensionResults();
  const out = r && r.prf && r.prf.results && r.prf.results.first;
  if (!out) throw new Error('noprf');
  return crypto.subtle.importKey('raw', out, 'AES-GCM', false, ['encrypt','decrypt']);
}
async function enrollFaceId(key){
  const cred = await navigator.credentials.create({publicKey:{
    challenge:rnd(32), rp:{name:'Parte de amanecer'},
    user:{id:rnd(16), name:'parte-de-amanecer', displayName:'Parte de amanecer'},
    pubKeyCredParams:[{type:'public-key', alg:-7},{type:'public-key', alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', residentKey:'preferred', userVerification:'required'},
    timeout:60000, extensions:{prf:{eval:{first:PRF_IN}}}}});
  const ext = cred.getClientExtensionResults() || {};
  if (ext.prf && ext.prf.enabled === false) throw new Error('noprf');
  const credId = new Uint8Array(cred.rawId);
  let wk;
  const first = ext.prf && ext.prf.results && ext.prf.results.first;
  wk = first ? await crypto.subtle.importKey('raw', first, 'AES-GCM', false, ['encrypt','decrypt']) : await prfWrapKey(credId);
  const raw = await crypto.subtle.exportKey('raw', key), iv = rnd(12);
  const w = await crypto.subtle.encrypt({name:'AES-GCM', iv}, wk, raw);
  ls.set(FKEY, JSON.stringify({c:enc64(credId), iv:enc64(iv), w:enc64(w)}));
}
async function openFaceId(){
  const s = JSON.parse(ls.get(FKEY));
  err.textContent = '';
  const wk = await prfWrapKey(u8(s.c));
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(s.iv)}, wk, u8(s.w));
  await show(await crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']));
}
function pwMode(){ $id('fidBox').hidden = true; $id('pwBox').hidden = false; $id('pw').focus(); }

(async () => {
  const saved = ls.get(KEY);
  if (saved) {
    try { await show(await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', true, ['decrypt'])); return; }
    catch (e) { ls.del(KEY); }
  }
  if (webauthnOK) $id('fidOpt').hidden = false; else $id('rem').checked = true;
  if (ls.get(FKEY) && webauthnOK) { $id('pwBox').hidden = true; $id('fidBox').hidden = false; }
})();

$id('fidBtn').addEventListener('click', async () => {
  try { await openFaceId(); }
  catch (e) {
    if (e && e.name === 'OperationError') { ls.del(FKEY); err.textContent = 'Face ID ya no es válido aquí. Entra con la contraseña para activarlo de nuevo.'; pwMode(); }
    else err.textContent = 'No se pudo usar Face ID. Prueba otra vez o usa la contraseña.';
  }
});
$id('usePw').addEventListener('click', pwMode);

$id('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  err.textContent = 'Abriendo…';
  let key;
  try { key = await derive($id('pw').value); await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct)); }
  catch (e) { err.textContent = 'Contraseña incorrecta.'; return; }
  if (webauthnOK && $id('useFid').checked && !ls.get(FKEY)) {
    err.textContent = 'Activando Face ID…';
    try { await enrollFaceId(key); }
    catch (e) { err.textContent = 'Este navegador no permite Face ID para esto; se usará la contraseña.'; await new Promise(r=>setTimeout(r,1500)); }
  }
  if ($id('rem').checked) {
    try { ls.set(KEY, enc64(await crypto.subtle.exportKey('raw', key))); } catch(_){}
  }
  await show(key);
});
