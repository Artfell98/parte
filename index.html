const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'parte-key-' + P.salt;
async function show(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
(async () => {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', true, ['decrypt']);
      await show(key); return;
    }
  } catch (e) { try { localStorage.removeItem(KEY); } catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Abriendo…';
  try {
    const key = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) {
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        localStorage.setItem(KEY, btoa(String.fromCharCode(...raw)));
      } catch(_){}
    }
    await show(key);
  } catch (e) { err.textContent = 'Contraseña incorrecta.'; }
});
